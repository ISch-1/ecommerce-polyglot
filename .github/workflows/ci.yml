name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Maven wrapper
        run: |
          if [ ! -f ./mvnw ]; then
            echo "Maven wrapper missing; using system maven"
          fi

      - name: Compile + unit tests
        run: ./mvnw -B -ntp -Dstyle.color=always test

      - name: Integration tests (Testcontainers)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"    # Ryuk is unnecessary on ephemeral runners
        run: ./mvnw -B -ntp -Dstyle.color=always verify -DskipUTs

      - name: Upload Surefire + Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image references must be lowercase; the owner (ISch-1) is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ecommerce-polyglot" >> "$GITHUB_ENV"

      # A plain Dockerfile instead of spring-boot:build-image: Boot 3.3's
      # buildpack client speaks Docker API 1.24, which current engines reject.
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
