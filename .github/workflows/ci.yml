name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-test:
    name: Build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Maven wrapper
        run: |
          if [ ! -f ./mvnw ]; then
            echo "Maven wrapper missing; using system maven"
          fi

      - name: Compile + unit tests
        run: ./mvnw -B -ntp -Dstyle.color=always test

      - name: Integration tests (Testcontainers)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"    # Ryuk is unnecessary on ephemeral runners
        run: ./mvnw -B -ntp -Dstyle.color=always verify -DskipUTs

      - name: Upload Surefire + Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with Spring Boot buildpacks
        run: |
          ./mvnw -B -ntp -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName=ghcr.io/${{ github.repository_owner }}/ecommerce-polyglot:${{ github.sha }}

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/ecommerce-polyglot:${{ github.sha }}
